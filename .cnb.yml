# CNB 流水线：测试 → 构建镜像
main:
  push:
    - stages:
        - name: install
          script: echo "零第三方依赖，跳过 npm install"
        - name: test
          script: node --test test/
        - name: smoke
          script: |
            SEO2API_DATA_DIR=./data-ci SEO2API_AUTH_MODE=none SEO2API_PORT=8899 node server.js &
            sleep 3
            curl -fsS http://127.0.0.1:8899/health || exit 1
            curl -fsS -X POST http://127.0.0.1:8899/v1/analyze \
              -H 'content-type: application/json' \
              -d '{"url":"example.com","fast":true}' | head -c 200
            kill %1
        - name: docker-build
          image: docker.cnb.cool/asoe/techsauce/seo2api:latest
          dockerfile: Dockerfile

$:
  pr:
    - stages:
        - name: test
          script: node --test test/
